v0_4_small:
  model:
    vocab_size: 5000
    d_model: 128
    num_layers: 4
    num_heads: 4
    d_ff: 512
    max_seq_len: 128
    dropout: 0.1

  training:
    batch_size: 32
    learning_rate: 5e-4
    warmup_steps: 30
    max_steps: 500
    gradient_accumulation_steps: 1
    max_grad_norm: 1.0
    eval_steps: 50
    save_steps: 50
    num_epochs: 15
    patience: 5
    bpe_merges: 1000

  device: auto

v0_5_planner:
