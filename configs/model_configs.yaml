small:
  model:
    vocab_size: 50000
    d_model: 384
    num_layers: 6
    num_heads: 6
    d_ff: 1024
    max_seq_len: 512
    dropout: 0.1

  training:
    batch_size: 16
    learning_rate: 1e-4
    warmup_steps: 1000
    max_steps: 10000
    gradient_accumulation_steps: 1
    max_grad_norm: 1.0
    eval_steps: 100
    save_steps: 100

  device: auto  # Will use CUDA if available, else CPU

medium:
  model:
    vocab_size: 50000
    d_model: 768
    num_layers: 12
    num_heads: 12
    d_ff: 3072
    max_seq_len: 1024
    dropout: 0.1

  training:
    batch_size: 32
    learning_rate: 1e-4
    warmup_steps: 5000
    max_steps: 50000
    gradient_accumulation_steps: 1
    max_grad_norm: 1.0
    eval_steps: 500
    save_steps: 500

  device: auto

large:
  model:
    vocab_size: 50000
    d_model: 1024
    num_layers: 24
    num_heads: 16
    d_ff: 4096
    max_seq_len: 2048
    dropout: 0.1

  training:
    batch_size: 64
    learning_rate: 5e-5
    warmup_steps: 10000
    max_steps: 100000
    gradient_accumulation_steps: 4
    max_grad_norm: 1.0
    eval_steps: 1000
    save_steps: 1000

  device: auto
